<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page_title }} — {{ t.site_title }}</title>
<meta name="description" content="{{ t.site_description }}">
<meta name="theme-color" content="#0f4c81">
<meta property="og:title" content="{{ t.site_title }}">
<meta property="og:description" content="{{ t.site_description }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ 'ar_TN' if lang == 'ar' else 'fr_TN' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% if lang == 'ar' %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
{% else %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
{% endif %}
<link rel="stylesheet" href="{{ site_root }}assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f4c81'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='white'>💧</text></svg>">
</head>
<body class="lang-{{ lang }}">
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ root }}index.html">{{ t.site_title }}</a>
    <nav>
      <a href="{{ root }}index.html">{{ t.nav_dams }}</a>
      <a href="{{ root }}agriculture.html">{{ t.nav_agriculture }}</a>
      <a href="{{ root }}about.html">{{ t.nav_about }}</a>
      <a class="lang-toggle" href="{{ alt_url }}" onclick="try { localStorage.setItem('tww-lang', '{{ other_lang }}'); } catch (e) {}"
         dir="{{ 'rtl' if other_lang == 'ar' else 'ltr' }}"
         lang="{{ other_lang }}">{{ t.lang_toggle_to_ar if other_lang == 'ar' else t.lang_toggle_to_fr }}</a>
    </nav>
  </div>
</header>
<main class="wrap">
